name: check

# Tests-only CI for humans and Cursor (`gh workflow run check`).
# No deploy, no repository secrets, no vendor bindings, no tenant apply.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate:examples
      - run: npm run check
